<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Intelligence of K1</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#2e261f; --muted:#81766c;
  --brown:#6b4934; --caramel:#c4864e; --olive:#6d7650; --orange:#d97835;
  --purple:#9b87b7; --purple2:#cfc2df; --line:#e9dfd5; --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 10% 0%,#fff8ef 0,#f6f1ea 38%,#f2ede6 100%);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
button,select,input{font:inherit}
.wrap{max-width:1500px;margin:auto;padding:28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:112px;height:58px;border-radius:12px;background:#fffdf9;border:1px solid #dfe6ef;
display:flex;align-items:center;gap:8px;padding:7px 9px;box-shadow:0 8px 20px #355c8a18;overflow:hidden}
.bxmark{width:34px;height:34px;border-radius:7px;background:#1465a8;color:#fff;display:grid;place-items:center;
font-weight:950;font-size:18px;letter-spacing:-1px;box-shadow:inset 0 0 0 2px #ffffff55}
.bxtext{line-height:.92}
.bxtext b{display:block;color:#155f9f;font-size:13px;letter-spacing:.35px}
.bxtext span{display:block;color:#4e5965;font-size:8px;font-weight:800;letter-spacing:.8px;margin-top:3px}
.bxtext em{display:block;color:#777;font-size:6.5px;font-style:normal;margin-top:3px}
h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.7px}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:13px;padding:9px 12px;font-weight:750;cursor:pointer;transition:.2s;display:flex;gap:8px;align-items:center}
.btn.primary{background:var(--brown);color:#fff;box-shadow:0 9px 20px #6b49342b}
.btn.primary:hover{transform:translateY(-1px);background:#563b2b}
.btn.ghost{background:#fffaf4;color:var(--brown);border:1px solid var(--line)}
.actions .btn{width:120px;height:38px;font-size:12px;line-height:1;white-space:nowrap;justify-content:center}
.viewbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.tabs{display:flex;gap:7px;background:#eee5dc;padding:5px;border-radius:14px;width:max-content;margin:0}
.view-reset{width:120px;height:38px;font-size:12px;line-height:1;white-space:nowrap;justify-content:center}
.tab{border:0;background:transparent;padding:9px 17px;border-radius:10px;color:#75685d;font-weight:800;cursor:pointer}
.tab.active{background:#fffdf9;color:var(--brown);box-shadow:0 3px 12px #6b493410}
.filters{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.filter{background:#fffaf4;border:1px solid var(--line);border-radius:13px;padding:9px 11px}
.filter label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:#988b80;font-weight:800;margin-bottom:4px}
.filter select{width:100%;border:0;background:transparent;color:var(--ink);font-weight:700;outline:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:rgba(255,253,249,.92);border:1px solid #eadfd5;border-radius:20px;box-shadow:0 12px 35px #5a463313;padding:18px}
.kpi{min-height:126px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-28px;top:-28px;background:var(--accent,#c4864e);opacity:.10}
.kpi .label{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.kpi .value{font-size:29px;font-weight:900;letter-spacing:-1px;margin-top:10px}
.kpi .hint{font-size:11px;color:var(--muted);margin-top:5px}
.section{margin-top:16px}
.chartgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.chartgrid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.cardtitle{font-size:15px;font-weight:900}
.cardnote{font-size:11px;color:var(--muted);margin-top:3px}
.chartbox{height:330px}
.smallchart{height:290px}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.insight{padding:15px;border-radius:16px;background:#fbf5ed;border:1px solid #eee1d4}
.insight .tag{font-size:10px;text-transform:uppercase;font-weight:900;letter-spacing:1px;color:var(--olive)}
.insight strong{display:block;font-size:14px;margin-top:7px;line-height:1.4}
.insight span{font-size:11px;color:var(--muted);line-height:1.45;display:block;margin-top:4px}
.tablewrap{overflow:auto;max-height:440px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#fffaf4;color:#786b60;font-size:10px;text-transform:uppercase;letter-spacing:.6px}
.badge{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#f1e7dc;color:var(--brown)}
.footer{padding:22px 3px;color:#9b8e83;font-size:11px;text-align:center}
.empty{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.chartgrid,.chartgrid2{grid-template-columns:1fr}.filters{grid-template-columns:repeat(3,1fr)}.insights{grid-template-columns:1fr}}
@media(max-width:650px){
      .wrap{padding:16px}
      .top{align-items:flex-start;flex-direction:column;margin-bottom:18px}
      .brand{width:100%}
      .logo{width:104px;height:54px}
      .bxtext b{font-size:12px}
      .viewbar{width:100%;gap:8px}
      .tabs{flex:1;min-width:0}
      .tab{padding:9px 12px;font-size:12px;flex:1}
      .view-reset{width:92px;flex:0 0 92px}
      .filters{grid-template-columns:1fr 1fr}
      .grid{grid-template-columns:1fr}
      h1{font-size:25px}
    }

/* Light sky blue header section */
.skyhead{background:#d6ecfa;border:1px solid #bfe0f5;border-radius:20px;padding:18px 20px 8px;margin-bottom:18px}
.skyhead .top{margin-bottom:18px}
.skyhead .viewbar{margin-bottom:18px}
.skyhead .tabs{background:#bfe0f5}
/* Official logo */
.logo{width:auto;height:44px;padding:0;background:transparent;border:0;box-shadow:none;border-radius:0;flex-shrink:0;overflow:visible}
.logo a{display:block;height:100%}
.logo img{height:100%;width:auto;display:block}
@media(max-width:650px){.logo{width:auto;height:37px}}
/* Rx share card */
.rxrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.rxrow span{font-size:12px;color:var(--muted);font-weight:800}
.rxrow b{font-size:20px;font-weight:900;letter-spacing:-.5px}
/* Monthly view */
.monthbtn{height:34px;padding:0 14px;font-size:12px;white-space:nowrap}
.monthbtn.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.mchips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.mchip{border:1px solid var(--line);background:#fffaf4;border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;color:var(--brown);line-height:1.25;font-size:13px}
.mchip b{display:block;font-weight:900}
.mchip span{display:block;font-size:10px;color:var(--muted);font-weight:700}
.mchip em{display:block;font-size:8px;font-style:normal;color:var(--olive);font-weight:900;text-transform:uppercase}
.mchip{min-width:0;overflow:hidden}
.mchip em{white-space:nowrap}
@media(max-width:480px){.mchips{gap:6px}.mchip{font-size:12px}.mchip em{font-size:7px;letter-spacing:-.2px}}
.mchip.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.mchip.on span,.mchip.on em{color:#ffffffcc}
.mchip.fut{border-style:dashed;background:transparent;color:#b5aaa0;cursor:default}
.mchip.fut span,.mchip.fut em{color:#c4bab0}
tr.mrow{cursor:pointer}
tr.msel td{background:#f6ecdf}
tr.mfut td{color:#b5aaa0}
tr.mtot td{background:#fbf5ed;font-weight:800}
th.sortable{cursor:pointer;user-select:none}
.btn.ghost.sm{height:30px;padding:0 12px;font-size:11px;white-space:nowrap}
</style>
</head>

/* ===== Sheet parser: current month on top, previous months stacked below ===== */
function monthKeyFromCell(v){
  const pad=n=>String(n).padStart(2,"0");
  if(typeof v==="number"&&v>30000&&v<90000){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)}
  if(v instanceof Date){const d=new Date(v.getTime()+12*36e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)}
  if(typeof v==="string"){
    let m=v.match(/(\d{4})[-\/](\d{1,2})/); if(m)return m[1]+"-"+pad(m[2]);
    const names=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
    m=v.toLowerCase().match(/^\s*([a-z]{3})[a-z]*[\s\-,\/'’]*(\d{2}|\d{4})\s*$/); if(m&&names.includes(m[1]))return (m[2].length===2?"20"+m[2]:m[2])+"-"+pad(names.indexOf(m[1])+1);
  }
  return null;
}
function isBlankRow(a){return !a||a.every(v=>v===null||v===undefined||String(v).trim()==="")}
function parseWideSheet(A){
  /* Layout: row 1 = month labels above column groups, row 2 = headers, data from row 3.
     Columns left of the first label = identity columns + current month metrics. */
  const lab=A[0], hdr=A[1].map(h=>h==null?"":String(h));
  const marks=[]; lab.forEach((v,i)=>{const k=typeof v==="string"?monthKeyFromCell(v):null; if(k)marks.push({i,k})});
  marks.forEach((m,j)=>{m.end=j+1<marks.length?marks[j+1].i:hdr.length});
  const first=marks[0].i, metricNorm=new Set();
  for(let c=marks[0].i;c<marks[0].end;c++)if(hdr[c].trim())metricNorm.add(norm(hdr[c]));
  const idIdx=[],curIdx=[];
  for(let c=0;c<first;c++){if(!hdr[c].trim())continue;(metricNorm.has(norm(hdr[c]))?curIdx:idIdx).push(c)}
  const columns=[...idIdx,...curIdx].map(c=>hdr[c]);
  const val=(a,c)=>a[c]===undefined?null:a[c];
  const rows=[], history={}; marks.forEach(m=>{history[m.k]=[]});
  for(let r=2;r<A.length;r++){
    const a=A[r]; if(idIdx.every(c=>a[c]==null||String(a[c]).trim()===""))continue;
    const base={}; idIdx.forEach(c=>{base[hdr[c]]=val(a,c)});
    const cur={...base}; curIdx.forEach(c=>{cur[hdr[c]]=val(a,c)}); rows.push(cur);
    marks.forEach(m=>{const o={...base}; for(let c=m.i;c<m.end;c++)if(hdr[c].trim())o[hdr[c]]=val(a,c); history[m.k].push(o)});
  }
  return {columns,rows,history};
}
function parseSheetBlocks(ws){
  const A=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  if(!A.length)return {columns:[],rows:[],history:{}};
  if(A.length>1&&A[0].some(v=>typeof v==="string"&&monthKeyFromCell(v)!==null))return parseWideSheet(A);
  const hdr=A[0].map(h=>h==null?"":String(h));
  const columns=hdr.filter(h=>h.trim()!=="");
  const toObj=(a,h,remap)=>{const o={};h.forEach((name,i)=>{if(name.trim()==="")return;
    if(remap){const c=columns.find(c=>norm(c)===norm(name));if(c)name=c}
    o[name]=a[i]===undefined?null:a[i]});return o};
  const rows=[]; let i=1;
  for(;i<A.length;i++){const a=A[i]; if(isBlankRow(a)||(typeof a[0]==="string"&&/previous/i.test(a[0])))break; rows.push(toObj(a,hdr,false));}
  const history={}; let key=null,h=null;
  for(;i<A.length;i++){
    const a=A[i]; if(isBlankRow(a))continue;
    const rest=a.slice(1).every(v=>v===null||v===undefined||String(v).trim()==="");
    if(rest){const k=monthKeyFromCell(a[0]); if(k){key=k;h=null;history[key]=history[key]||[]} continue}
    if(!key)continue;
    if(!h){h=a.map(x=>x==null?"":String(x));continue}
    history[key].push(toObj(a,h,true));
  }
  return {columns,rows,history};
}

async function loadOnlineWorkbook(){
  try{
    // Timestamp prevents the browser from reusing yesterday's workbook.
    const url = DATA_FILE + "?v=" + Date.now();
    const response = await fetch(url, {cache:"no-store"});
    if(!response.ok) throw new Error("HTTP " + response.status);

    const buffer = await response.arrayBuffer();
    const wb = XLSX.read(buffer, {type:"array", cellDates:false});
    const obj = {};

    wb.SheetNames.forEach(sheetName=>{
      obj[sheetName] = parseSheetBlocks(wb.Sheets[sheetName]);
    });

    if(!Object.keys(obj).length) throw new Error("Workbook has no sheets");

    dataStore = obj;
    dataSource = "☁️ Live: data.xlsx";
    updateSourceBadge();
    render();
    return true;
  }catch(error){
    console.warn("Could not load ./data.xlsx. Using embedded fallback.", error);
    dataStore = initialData;
    dataSource = "⚠️ Fallback data";
    updateSourceBadge();
    render();
    return false;
  }
}

function updateSourceBadge(){
  const el = document.getElementById("sourceBadge");
  if(el) el.textContent = dataSource;
}

  return dataStore[key] || {columns:[],rows:[]};
}
function sheetsForMode(){
  const d=rawSheetForMode();
  if(selMonth&&curMonthKey&&selMonth!==curMonthKey)return {columns:d.columns,rows:(d.history&&d.history[selMonth])||[]};
  return d;
}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function findCol(cols, patterns){
  for(const p of patterns){const x=cols.find(c=>norm(c).includes(p));if(x)return x}
  return null

/* ===== Rx Share & Value Share (sheets: "rx share" + "value share") ===== */
let rxState={summary:null,list:[],ctx:{}};
function sheetByName(re){const k=Object.keys(dataStore).find(k=>re.test(k));return k?dataStore[k]:null}
function fmtN(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function rxData(mk){
  const rx=sheetByName(/rx/i), vs=sheetByName(/value\s*share/i);
  if(!rx||!vs)return [];
  const pick=sh=>(!mk||mk===curMonthKey)?sh.rows:((sh.history&&sh.history[mk])||[]);
  const rxRows=pick(rx), vsRows=pick(vs);
  const c=rx.columns, vc=vs.columns;
  const K={terr:findCol(c,["territorycode"]),base:findCol(c,["base"]),grp:findCol(c,["group"]),tot:findCol(c,["totalproduct"]),bpl:findCol(c,["bplproduct"]),rx:findCol(c,["rxshare"])};
  const V={terr:findCol(vc,["territorycode"]),base:findCol(vc,["base"]),grp:findCol(vc,["group"]),val:findCol(vc,["valueshare"])};
  const key=(t,b,g)=>[String(t).trim(),norm(b),String(g).trim()].join("|");
  const vmap={};
  vsRows.forEach(r=>{vmap[key(r[V.terr],r[V.base],r[V.grp])]=num(r[V.val])});
  return rxRows.map(r=>({
    terr:String(r[K.terr]).trim(), base:norm(r[K.base]), grp:String(r[K.grp]).trim(),
    tot:num(r[K.tot]), bpl:num(r[K.bpl]), rx:num(r[K.rx])*100,
    val:(vmap[key(r[K.terr],r[K.base],r[K.grp])]||0)*100
  }));
}
function rxContext(fr,cols){
  const areaC=findCol(cols,["area"]), terrC=findCol(cols,["territorycode","territory"]);
  const teamC=mode==="MPE"?findCol(cols,["team"]):null;
  let area=selectVal("fArea"), terr=selectVal("fTerritory"), team=mode==="MPE"?selectVal("fTeam"):"";
  if(selectVal("fEmployee")&&fr.length){
    const r=fr[0];
    if(areaC)area=String(r[areaC]);
    if(mode==="MPE"){ if(terrC)terr=String(r[terrC]); if(teamC)team=String(r[teamC]); }
  }
  return {area,terr,team};
}
function rxCompute(all,ctx,terrArea){
  const B=b=>all.filter(r=>r.base===b);
  const inArea=r=>!ctx.area||terrArea[r.terr]===ctx.area;
  let list=[], summary=null;
  if(mode==="ASE"){
    list=B("ase").filter(r=>!ctx.area||r.terr===ctx.area);
    summary=ctx.area?list[0]:B("rse")[0];
  }else if(ctx.terr){
    list=B("mpe").filter(r=>r.terr===ctx.terr&&(!ctx.team||r.grp===ctx.team));
    summary=ctx.team?list[0]:B("mpeter").find(r=>r.terr===ctx.terr);
  }else if(ctx.team){
    list=B("mpe").filter(r=>r.grp===ctx.team&&inArea(r));
    const tot=list.reduce((a,r)=>a+r.tot,0), bpl=list.reduce((a,r)=>a+r.bpl,0);
    summary=list.length?{tot,bpl,rx:tot?bpl/tot*100:0,val:tot?list.reduce((a,r)=>a+r.val*r.tot,0)/tot:0,approx:list.length>1,n:list.length}:null;
  }else{
    list=B("mpeter").filter(inArea);
    summary=ctx.area?B("ase").find(r=>r.terr===ctx.area):B("rse")[0];
  }
  return {summary:summary||null,list,ctx};
}
function rxLabel(r){return mode==="ASE"?r.terr:(rxState.ctx.terr?r.grp:r.terr)}
function rxTopItem(){
  const top=[...rxState.list].filter(r=>r.tot>0).sort((a,b)=>b.rx-a.rx)[0];
  if(!top)return ["No Rx data in this view.","Rx share data is not available for the current selection."];
  return [`${rxLabel(top)} leads at ${top.rx.toFixed(2)}% Rx share.`,`BPL ${fmtN(top.bpl)} of ${fmtN(top.tot)} products • Value share ${top.val.toFixed(2)}%`];
}
function makeRxTable(){
  const el=document.getElementById("rxTable"); if(!el)return;
  const rows=[...rxState.list].sort((a,b)=>b.rx-a.rx);
  if(!rows.length){el.innerHTML='<tbody><tr><td class="empty">No Rx data for this selection</td></tr></tbody>';return}
  const isM=mode==="MPE";
  el.innerHTML=`<thead><tr><th>${isM?"Territory":"Area"}</th>${isM?"<th>Team</th>":""}<th>Total Product</th><th>BPL Product</th><th>Rx Share</th><th>Value Share</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td><b>${r.terr}</b></td>${isM?`<td><span class="badge">${r.base==="mpeter"?"All":r.grp}</span></td>`:""}<td>${fmtN(r.tot)}</td><td>${fmtN(r.bpl)}</td><td><span class="badge">${r.rx.toFixed(2)}%</span></td><td>${r.val.toFixed(2)}%</td></tr>`).join("")
  }</tbody>`;
}

/* ===== Monthly View (fiscal year Jul–Jun) ===== */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let selMonth=null, monthlyOpen=false, curMonthKey=null;
function mLabel(k){const p=k.split("-");return MON[+p[1]-1]+" "+p[0]}
function ensureMonths(){
  const valid=new Set(); let latest=null;
  Object.values(dataStore).forEach(d=>Object.keys(d.history||{}).forEach(k=>{valid.add(k);if(!latest||k>latest)latest=k}));
  if(latest){const p=latest.split("-").map(Number);const n=new Date(Date.UTC(p[0],p[1],1));curMonthKey=n.getUTCFullYear()+"-"+String(n.getUTCMonth()+1).padStart(2,"0")}
  else{const t=new Date();curMonthKey=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")}
  valid.add(curMonthKey);
  if(!selMonth||!valid.has(selMonth))selMonth=curMonthKey;
}
function fyMonths(){
  const p=curMonthKey.split("-").map(Number), start=p[1]>=7?p[0]:p[0]-1, out=[];
  for(let i=0;i<12;i++){const m=((6+i)%12)+1, y=start+(i>=6?1:0); out.push(y+"-"+String(m).padStart(2,"0"))}
  return out;
}
function filterRowsFor(rows,cols){
  const pairs=[
    ["fArea",findCol(cols,["area"])],
    ["fTerritory",findCol(cols,["territorycode","territory"])],
    ["fTeam",mode==="MPE"?findCol(cols,["team"]):findCol(cols,["division"])],
    ["fEmployee",mode==="MPE"?findCol(cols,["territoryemployee","employee"]):findCol(cols,["aseemployee","employee"])]
  ];
  return rows.filter(r=>pairs.every(([id,c])=>!c||!selectVal(id)||String(r[c])===selectVal(id)));
}
function monthStats(key){
  const d=rawSheetForMode(), cols=d.columns;
  const src=key===curMonthKey?d.rows:(d.history||{})[key];
  if(!src||!src.length)return null;
  const fr=filterRowsFor(src,cols);
  if(!fr.length)return {n:0};
  const t=findCol(cols,["targetvalue","target"]), s=findCol(cols,["soldvalue","sold"]), tr=findCol(cols,["transitvalue","transit"]),
        tv=findCol(cols,["totalvalue","total"]), va=findCol(cols,["variance"]), rv=findCol(cols,["returnvalue"]);
  const T=sum(fr,t),S=sum(fr,s),TR=sum(fr,tr),TV=sum(fr,tv),V=sum(fr,va),RV=sum(fr,rv);
  let rs=null; const rd=rxData(key);
  if(rd.length){const tc2=findCol(cols,["territorycode","territory"]),ac2=findCol(cols,["area"]),ta={};
    if(mode==="MPE"&&tc2&&ac2)src.forEach(r=>{ta[String(r[tc2])]=String(r[ac2])});
    rs=rxCompute(rd,rxContext(fr,cols),ta).summary}
  return {n:fr.length,T,S,TR,TV,V,RV,A:T?TV/T*100:0,R:S?RV/S*100:0,rx:rs?rs.rx:null,val:rs?rs.val:null};
}

  </section>`;
  const labels=fy.map(k=>MON[+k.split("-")[1]-1]);

let productStore=null, productStatus="loading", productLive=null, prodSort={key:"no",dir:1}, prodCtx=null, prodShowAll=false;

function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function pcKey(v){return String(v==null?"":v).trim().toUpperCase()}
function buildProductMeta(mapRows){
  const p2n={}, ord=new Map();
  mapRows.forEach(([no,team,name,pc])=>{
    p2n[pcKey(pc)]=name;
    if(!ord.has(name))ord.set(name,{no:num(no)||9999,team:String(team||"").trim()});
  });
  const focus=[...ord.entries()].map(([name,o])=>({name,no:o.no,team:o.team}))
    .sort((a,b)=>a.no-b.no||a.name.localeCompare(b.name));
  return {p2n,focus};
}
function parseProductMap(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
  if(!rows.length)return [];
  const k=Object.keys(rows[0]), f=n=>k.find(c=>norm(c)===n);
  const cNo=f("no"), cTeam=f("team"), cProd=f("product"), cPc=f("pcode");
  if(!cProd||!cPc)return [];
  return rows.filter(r=>r[cProd]!=null&&String(r[cProd]).trim()!==""&&r[cPc]!=null&&String(r[cPc]).trim()!=="")
    .map(r=>[cNo?r[cNo]:null,cTeam?r[cTeam]:"",String(r[cProd]).trim(),String(r[cPc]).trim()]);
}
function parseProductSheet(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
  if(!rows.length)return {rows:[],missing:["(empty sheet)"]};
  const cols=Object.keys(rows[0]), f=n=>cols.find(c=>norm(c)===n);
  const C={ase:f("ase"),mpe:f("mpe"),team:f("team"),brand:f("brand"),pcode:f("pcode"),t:f("targetvalue"),s:f("soldtransitvalue")};
  const missing=Object.entries({ASE:C.ase,MPE:C.mpe,Team:C.team,Pcode:C.pcode,"Target Value":C.t,"Sold+transit Value":C.s}).filter(([k,v])=>!v).map(([k])=>k);
  if(missing.length)return {rows:[],missing};
  const out=[];
  rows.forEach(r=>{
    const ase=String(r[C.ase]??"").trim(), mpe=String(r[C.mpe]??"").trim(), pc=pcKey(r[C.pcode]);
    if(!ase||!mpe||!pc)return;                  // skips total / blank rows
    out.push({ase,mpe,team:String(r[C.team]??"").trim(),brand:C.brand?String(r[C.brand]??"").trim():"",pcode:pc,t:num(r[C.t]),s:num(r[C.s])});
  });
  return {rows:out,missing:[]};
}
function aggRecords(rows,p2n){
  const m=new Map();
  rows.forEach(r=>{
    const name=p2n[r.pcode]||r.brand||r.pcode, k=r.ase+"|"+r.mpe+"|"+r.team+"|"+name;
    const o=m.get(k)||{ase:r.ase,mpe:r.mpe,team:r.team,name,t:0,s:0}; o.t+=r.t; o.s+=r.s; m.set(k,o);
  });
  return [...m.values()];
}
function parseProductWorkbook(wb){
  let mapRows=[], cur=null, hist={}, missing=[];
  wb.SheetNames.forEach(name=>{
    if(/map/i.test(name)){mapRows=parseProductMap(wb.Sheets[name]);return}
    if(/how|read\s*me|instruction|note/i.test(name))return;
    const p=parseProductSheet(wb.Sheets[name]);
    if(p.missing.length){missing=p.missing;return}
    const mk=monthKeyFromCell(name);
    if(mk)hist[mk]=p.rows; else if(cur===null)cur=p.rows;
  });
  const meta=buildProductMeta(mapRows), history={};
  Object.keys(hist).forEach(k=>{history[k]=aggRecords(hist[k],meta.p2n)});
  return {meta,current:cur?aggRecords(cur,meta.p2n):null,history,missing};
}
function productFromFallback(){
  const F=PRODUCT_FALLBACK;
  return {meta:buildProductMeta(F.map),current:F.current.map(([ase,mpe,team,name,t,s])=>({ase,mpe,team,name,t,s})),history:{},missing:[]};
}
async function loadProductWorkbook(){
  try{
    const res=await fetch(PRODUCT_FILE+"?v="+Date.now(),{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    productStore=parseProductWorkbook(XLSX.read(await res.arrayBuffer(),{type:"array"}));
    productLive=true;
    productStatus=(productStore.current&&productStore.current.length)||Object.keys(productStore.history).length?"ok":"badcols";
  }catch(e){
    console.warn("Could not load "+PRODUCT_FILE+". Using embedded preview data.",e);
    productStore=productFromFallback(); productLive=false; productStatus="ok";
  }
  renderProducts();
}
function productList(src,ctx){
  const meta=productStore.meta, m=new Map();
  src.forEach(r=>{
    if(mode==="ASE"){if(r.ase!==ctx.area)return}
    else{if(r.mpe!==ctx.terr)return; if(ctx.team&&r.team!==ctx.team)return}
    const o=m.get(r.name)||{t:0,s:0}; o.t+=r.t; o.s+=r.s; m.set(r.name,o);
  });
  const focusNames=new Set(meta.focus.map(f=>f.name)), out=[];
  meta.focus.forEach(f=>{
    if(mode==="MPE"&&ctx.team&&f.team&&f.team!==ctx.team)return;
    const o=m.get(f.name)||{t:0,s:0}; out.push({name:f.name,t:o.t,s:o.s,ord:out.length});
  });
  const others=[...m.entries()].filter(([n,o])=>!focusNames.has(n)&&(o.t||o.s))
    .sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true,sensitivity:"base"}));
  const all=prodShowAll||!meta.focus.length;
  if(all)others.forEach(([n,o])=>out.push({name:n,t:o.t,s:o.s,ord:out.length}));
  return {list:out.map(x=>({...x,a:x.t>0?x.s/x.t*100:null})),otherCount:others.length,hasFocus:meta.focus.length>0};
}

  host.innerHTML=`<section class="section card">${headWith(toggle)}<div class="tablewrap"><table><thead><tr>${th("no","No")}${th("name","Product")}${th("t","Target Value")}${th("s","Sold+Transit Value")}${th("a","Ach %")}</tr></thead><tbody>${
    list.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${money(x.t)}</td><td>${money(x.s)}</td><td><span class="badge">${x.a==null?"—":pct(x.a)}</span></td></tr>`).join("")
  }<tr class="mtot"><td></td><td><b>Total (${list.length} products)</b></td><td>${money(T)}</td><td>${money(S)}</td><td><span class="badge">${T>0?pct(S/T*100):"—"}</span></td></tr></tbody></table></div></section>`;
}

function render(){
  ensureMonths();
  destroyCharts();
  const d=sheetsForMode(), cols=d.columns, rows=d.rows;
  populateFilters(rows,cols);
  const fr=filteredRows();
  const target=findCol(cols,["targetvalue","target"]);
  const sold=findCol(cols,["soldvalue","sold"]);
  const transit=findCol(cols,["transitvalue","transit"]);
  const total=findCol(cols,["totalvalue","total"]);
  const ach=findCol(cols,["ach"]);
  const variance=findCol(cols,["variance"]);
  const retVal=findCol(cols,["returnvalue"]);
  const retPct=findCol(cols,["returnperc","returnpercentage"]);
  const territory=findCol(cols,["territorycode","territory"]);
  const employee=mode==="MPE"?findCol(cols,["territoryemployee","employee"]):findCol(cols,["aseemployee","employee"]);
  const territorySelected = selectVal("fTerritory");
  const groupCol = (mode==="MPE" && territorySelected) ? employee : findCol(cols,["territorycode","territory","area"]);

  const T=sum(fr,target), S=sum(fr,sold), TR=sum(fr,transit), TV=sum(fr,total);
  const A=T?TV/T*100:avg(fr,ach);
  const V=sum(fr,variance), RV=sum(fr,retVal), RP=S?RV/S*100:avg(fr,retPct);
  const n=fr.length;
  const achieved=fr.filter(r=>num(r[ach])>=100).length;

  const terrArea={}; if(mode==="MPE"){const tc=findCol(cols,["territorycode","territory"]),ac=findCol(cols,["area"]); rows.forEach(r=>{if(tc&&ac)terrArea[String(r[tc])]=String(r[ac])})}
  const rxMonthData=rxData(selMonth);
  rxState=rxMonthData.length?rxCompute(rxMonthData,rxContext(fr,cols),terrArea):{summary:null,list:[],ctx:{}};
  const rs=rxState.summary;
  const rxCard=`<div class="card kpi" style="--accent:#d97835"><div class="label">Rx Share &amp; Value Share</div>`+(rs
    ?`<div class="rxrow" style="margin-top:8px"><span>Rx %</span><b>${rs.rx.toFixed(2)}%</b></div><div class="rxrow"><span>Value %</span><b>${rs.val.toFixed(2)}%</b></div><div class="hint">Total Product ${fmtN(rs.tot)} • BPL Product ${fmtN(rs.bpl)}${rs.approx?" • Value % = weighted avg":""}</div>`
    :`<div class="hint" style="margin-top:14px">${!rxMonthData.length?"Rx data not added for this month":"No Rx data for this selection"}</div>`)+`</div>`;

  document.getElementById("app").innerHTML=`
    <section class="grid">
      <div class="card kpi" style="--accent:#6b4934"><div class="label">Target Value</div><div class="value">${money(T)}</div><div class="hint">${n.toLocaleString()} ${mode} records in view</div></div>
      <div class="card kpi" style="--accent:#c4864e"><div class="label">Sold Value</div><div class="value">${money(S)}</div><div class="hint">Direct sold contribution</div></div>
      <div class="card kpi" style="--accent:#6d7650"><div class="label">Total Value</div><div class="value">${money(TV)}</div><div class="hint">Sold + transit</div></div>
      <div class="card kpi" style="--accent:#9b87b7"><div class="label">Achievement</div><div class="value">${pct(A)}</div><div class="hint">${achieved} records at/above 100% by reported Ach %</div></div>
      <div class="card kpi" style="--accent:#d97835"><div class="label">Transit Value</div><div class="value">${money(TR)}</div><div class="hint">${T?pct(TR/T*100):"0%"} of target</div></div>
      <div class="card kpi" style="--accent:#9b87b7"><div class="label">Return Value</div><div class="value">${money(RV)}</div><div class="hint">Return rate ${pct(RP)}</div></div>
      <div class="card kpi" style="--accent:#6d7650"><div class="label">Variance</div><div class="value">${money(V)}</div><div class="hint">Reported variance (+/-)</div></div>
      ${rxCard}
    </section>

    <section class="section">
      <div class="card"><div class="cardhead"><div><div class="cardtitle">Target vs Total Value</div><div class="cardnote">Grouped by ${groupCol||"available category"}</div></div></div><div class="chartbox"><canvas id="barChart"></canvas></div></div>
    </section>

    <section class="section chartgrid2">
      <div class="card"><div class="cardhead"><div><div class="cardtitle">Achievement by Group</div><div class="cardnote">Reported achievement percentage</div></div></div><div class="chartbox"><canvas id="achChart"></canvas></div></div>
      <div class="card"><div class="cardhead"><div><div class="cardtitle">Performance Trend</div><div class="cardnote">Record sequence used when no date column exists</div></div></div><div class="chartbox"><canvas id="lineChart"></canvas></div></div>
    </section>

    <section class="section card">
      <div class="cardhead"><div><div class="cardtitle">Automatic Insights</div><div class="cardnote">Generated from the currently filtered dataset</div></div><span class="badge">${mode} • ${n} rows</span></div>
      <div class="insights" id="insights"></div>
    </section>

    <section class="section card">
      <div class="cardhead"><div><div class="cardtitle">Detailed Performance</div><div class="cardnote">Sortable-style executive snapshot of the current view</div></div></div>
      <div class="tablewrap"><table id="detailTable"></table></div>
    </section>

    <div id="productHost"></div>

    <section class="section card">
      <div class="cardhead"><div><div class="cardtitle">Detail Rx Performance</div><div class="cardnote">Rx share &amp; value share for the current view</div></div></div>
      <div class="tablewrap"><table id="rxTable"></table></div>
    </section>
  `;

  makeCharts(fr,cols,{target,sold,transit,total,ach,groupCol,employee});
  makeInsights(fr,cols,{target,sold,transit,total,ach,variance,retVal,retPct,territory,employee});
  makeTable(fr,cols,{target,sold,total,ach,variance,retPct,territory,employee});
  makeRxTable();
  updateMonthBadge();
  renderMonthly();
  prodCtx=rxContext(fr,cols);
  renderProducts();
}

function group(rows,col){
  const m={};
  if(!col)return m;
  rows.forEach(r=>{const k=String(r[col]??"Unknown"); if(!m[k])m[k]=[];m[k].push(r)});
  return m;
}
function makeCharts(rows,cols,c){
  const g=group(rows,c.groupCol), keys=Object.keys(g);
  const labels=keys.slice(0,20);
  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{usePointStyle:true,font:{size:11}}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:"#eee6de"},ticks:{font:{size:10}}}}};
  charts.bar=new Chart(document.getElementById("barChart"),{type:"bar",data:{labels,datasets:[
    {label:"Target",data:labels.map(k=>sum(g[k],c.target)),backgroundColor:"#cfc2df",borderRadius:7},
    {label:"Total",data:labels.map(k=>sum(g[k],c.total)),backgroundColor:"#6b4934",borderRadius:7}
  ]},options:opts});
  charts.ach=new Chart(document.getElementById("achChart"),{type:"bar",data:{labels,datasets:[{label:"Ach %",data:labels.map(k=>c.ach?avg(g[k],c.ach):sum(g[k],c.total)/Math.max(sum(g[k],c.target),1)*100),backgroundColor:"#6d7650",borderRadius:7}]},
  options:{...opts,indexAxis:"y",scales:{x:{grid:{color:"#eee6de"},beginAtZero:true,ticks:{callback:v=>v+"%"}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});
  const dateCol=findCol(cols,["date","month","period"]);
  let trendRows=rows;
  let labels2;
  if(dateCol){
    const gg=group(rows,dateCol); labels2=Object.keys(gg).slice(0,30);
    trendRows=labels2.map(k=>({k,v:sum(gg[k],c.total)}));
  }else{
    labels2=rows.slice(0,30).map((r,i)=>c.employee?String(r[c.employee]).split(",")[0]+" #"+(i+1):"#"+(i+1));
    trendRows=rows.slice(0,30).map(r=>({v:num(r[c.total])}));
  }
  charts.line=new Chart(document.getElementById("lineChart"),{type:"line",data:{labels:labels2,datasets:[{label:"Total Value",data:trendRows.map(x=>x.v),borderColor:"#d97835",backgroundColor:"#d9783520",fill:true,tension:.35,pointRadius:2}]},options:opts});
}
function makeInsights(rows,cols,c){
  const box=document.getElementById("insights"); const g=group(rows,c.territory||c.employee||findCol(cols,["area"])); 
  const entries=Object.entries(g).map(([k,v])=>({k,ach:c.ach?avg(v,c.ach):sum(v,c.total)/Math.max(sum(v,c.target),1)*100,total:sum(v,c.total),target:sum(v,c.target),ret:c.retPct?avg(v,c.retPct):0})).sort((a,b)=>b.ach-a.ach);
  const top=entries[0], low=entries[entries.length-1];
  const bestReturn=[...entries].sort((a,b)=>b.ret-a.ret)[0];
  const items=[
    ["Top achievement",top?`${top.k} leads at ${pct(top.ach)}.`:"Not enough data.","Highest reported achievement in the current filter."],
    ["Biggest opportunity",low?`${low.k} is at ${pct(low.ach)}.`:"Not enough data.","This is the lowest achievement group in the current view."],
    ["Top Rx Share",...rxTopItem()],
    ["Transit potential",`${money(sum(rows,c.transit))} in transit.`,"Transit can materially change realized performance once converted."],
    ["Return watch",bestReturn&&bestReturn.ret?`${bestReturn.k}: ${pct(bestReturn.ret)} return rate.`:"Return-rate data is limited.","Higher return percentage deserves review."],
    ["Mix signal",`${pct(sum(rows,c.sold)/Math.max(sum(rows,c.total),1)*100)} of total is sold.`,"The balance is transit value."]
  ];
  box.innerHTML=items.map(x=>`<div class="insight"><div class="tag">${x[0]}</div><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join("");
}
function makeTable(rows,cols,c){
  // In MPE view, selecting a territory shows the individual MPEs inside it.
  const selectedTerritory = selectVal("fTerritory");
  const groupCol = (mode==="MPE" && selectedTerritory) ? c.employee : (mode==="ASE" ? c.employee : c.territory);
  const g=group(rows,groupCol);
  const teamCol = mode==="MPE" ? findCol(cols,["team"]) : null;
  const arr=Object.entries(g).map(([k,v])=>({
    name:k, team:teamCol ? String(v[0]?.[teamCol] ?? "") : "",
    target:sum(v,c.target), sold:sum(v,c.sold), total:sum(v,c.total),
    ach:c.ach?avg(v,c.ach):sum(v,c.total)/Math.max(sum(v,c.target),1)*100,
    var:sum(v,c.variance), ret:c.retPct?avg(v,c.retPct):0
  })).sort((a,b)=>b.ach-a.ach);
  const firstHead = mode==="MPE" ? "MPE" : (groupCol||"Employee");
  document.getElementById("detailTable").innerHTML=`<thead><tr><th>${firstHead}</th>${mode==="MPE"?"<th>Team</th>":""}<th>Target</th><th>Sold</th><th>Total</th><th>Ach %</th><th>Variance</th><th>Return %</th></tr></thead><tbody>${
    arr.map(x=>`<tr><td><b>${x.name}</b></td>${mode==="MPE"?`<td><span class="badge">${x.team}</span></td>`:""}<td>${money(x.target)}</td><td>${money(x.sold)}</td><td>${money(x.total)}</td><td><span class="badge">${pct(x.ach)}</span></td><td>${money(x.var)}</td><td>${pct(x.ret)}</td></tr>`).join("")
  }</tbody>`;
}

function importDataset(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      let wb;
      if(/\.csv$/i.test(file.name)){
        const text=new TextDecoder().decode(ev.target.result);
        const rows=text.split(/\r?\n/).filter(Boolean).map(x=>x.split(","));
        const cols=rows[0]||[]; dataStore={"Imported CSV":{columns:cols,rows:rows.slice(1).map(r=>Object.fromEntries(cols.map((c,i)=>[c,r[i]])))}}; mode="MPE";
      }else{
        wb=XLSX.read(ev.target.result,{type:"array",cellDates:true});
        const obj={};
        wb.SheetNames.forEach(s=>{
          const arr=XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:null});
          obj[s]={columns:arr.length?Object.keys(arr[0]):[],rows:arr};
        });
        dataStore=obj;
        if(!Object.keys(obj).some(k=>/mpe/i.test(k)) && Object.keys(obj).some(k=>/ase/i.test(k))) mode="ASE";
      }
      setMode(mode);
      dataSource = "📱 Local browser preview"; updateSourceBadge(); alert("Dataset imported successfully. Dashboard refreshed in this browser.");
    }catch(err){alert("Could not read this file. Please use a valid CSV, XLS or XLSX file.");console.error(err)}
    e.target.value="";
  };
  reader.readAsArrayBuffer(file);
}
